{% extends "layout.html" %}

{% block title %}
{{ video.title }}
{% endblock %}

{% block content %}

<div class="video-page">

    <div class="video-container">

        <h1>

            {{ video.title }}

        </h1>

        <iframe
            src="{{ video.filename }}"
            width="100%"
            height="500"
            frameborder="0"
            allowfullscreen
            class="video-player">
        </iframe>

    </div>

</div>

{% endblock %}
